name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # The web module's preBuild runs `pnpm run build`, so Node + pnpm are required
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
            python3 - <<'EOF'
          import copy, json
          p = 'app/google-services.json'
          d = json.load(open(p))
          pkgs = {c['client_info']['android_client_info']['package_name'] for c in d['client']}
          # Debug builds use applicationIdSuffix ".debug"; the Firebase console
          # app only registers com.mgn.ai, so add a debug client for compilation.
          if 'com.mgn.ai.debug' not in pkgs:
              dbg = copy.deepcopy(d['client'][0])
              dbg['client_info']['android_client_info']['package_name'] = 'com.mgn.ai.debug'
              d['client'].append(dbg)
              json.dump(d, open(p, 'w'))
              print('added com.mgn.ai.debug client for local validation build')
          EOF
          else
            echo '::warning::GOOGLE_SERVICES_JSON secret is not set; using a placeholder so validation builds can compile. Add your Firebase google-services.json as a repo secret for full functionality.'
            cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "mgn-ai-placeholder",
              "storage_bucket": "mgn-ai-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.mgn.ai" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "placeholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000001",
                  "android_client_info": { "package_name": "com.mgn.ai.debug" }
                },
                "oauth_client": [],
                "api_key": [{ "current_key": "placeholder" }],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Assemble debug
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain

      - name: Verify APK identity and locales
        run: |
          ls -la app/build/outputs/apk/debug/
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          for APK in app/build/outputs/apk/debug/*.apk; do
            echo "== $APK"
            "$AAPT" dump badging "$APK" | grep -E "^package:|^application:|locales:" | head -5
          done

      - name: Run unit tests
        run: ./gradlew test --console=plain

      - name: Run Android Lint
        run: ./gradlew lint --console=plain

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/lint-results-*.sarif
